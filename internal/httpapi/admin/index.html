<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K12Edu Admin</title><link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css"><style>body{margin:0;background:#f4f6fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1280px;margin:0 auto;padding:28px}.login{max-width:420px;margin:12vh auto}</style></head><body><div id="app"><el-card v-if="!token" class="login"><h2>K12Edu 管理后台</h2><el-form @submit.prevent="login"><el-form-item><el-input v-model="form.email" placeholder="管理员邮箱"/></el-form-item><el-form-item><el-input v-model="form.password" type="password" placeholder="密码" show-password/></el-form-item><el-button type="primary" native-type="submit" :loading="busy">登录</el-button><el-alert v-if="error" :title="error" type="error" show-icon style="margin-top:16px"/></el-form></el-card><div v-else class="wrap"><el-row justify="space-between"><div><h1>K12Edu 管理控制台</h1><p>用户、内容、AI 用量与安全审核</p></div><el-button @click="logout">退出</el-button></el-row><el-tabs v-model="tab" @tab-change="load"><el-tab-pane label="概览" name="stats"><el-row :gutter="16"><el-col :span="6" v-for="(v,k) in stats" :key="k"><el-card><div>{{labels[k]||k}}</div><h2>{{v}}</h2></el-card></el-col></el-row></el-tab-pane><el-tab-pane label="用户管理" name="users"><el-table :data="users" stripe><el-table-column prop="email" label="邮箱"/><el-table-column prop="displayName" label="名称"/><el-table-column label="角色"><template #default="s"><el-select v-model="s.row.role" @change="role(s.row)"><el-option v-for="x in roles" :key="x" :value="x"/></el-select></template></el-table-column><el-table-column prop="createdAt" label="注册时间"/></el-table></el-tab-pane><el-tab-pane label="AI 用量" name="ai"><el-table :data="ai"><el-table-column prop="model" label="模型"/><el-table-column prop="calls" label="调用次数"/><el-table-column prop="inputBytes" label="输入字节"/><el-table-column prop="outputBytes" label="输出字节"/></el-table></el-tab-pane><el-tab-pane label="内容管理" name="content"><el-alert title="内容接口已开放：可由客户端或后续运营页面调用 /api/v1/admin/content。" type="info" show-icon/></el-tab-pane></el-tabs></div></div><script src="https://unpkg.com/vue@3/dist/vue.global.js"></script><script src="https://unpkg.com/element-plus/dist/index.full.js"></script><script>const{createApp}=Vue;createApp({data:()=>({token:localStorage.k12token||'',busy:false,error:'',tab:'stats',form:{email:'',password:''},stats:{},users:[],ai:[],labels:{users:'用户总数',activeUsers24h:'24小时活跃',aiCalls24h:'24小时 AI 调用'},roles:['student','parent','admin']}),mounted(){if(this.token)this.load()},methods:{async api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+this.token,'Content-Type':'application/json'};let r=await fetch(path,opt);if(r.status===401)this.logout();return r.json()},async login(){this.busy=true;this.error='';let r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.form)}),d=await r.json();this.busy=false;if(!r.ok){this.error=d.error||'登录失败';return}this.token=d.accessToken;localStorage.k12token=this.token;this.load()},logout(){localStorage.removeItem('k12token');this.token=''},async load(){if(this.tab==='stats')this.stats=await this.api('/api/v1/admin/stats');if(this.tab==='users')this.users=(await this.api('/api/v1/admin/users')).users||[];if(this.tab==='ai')this.ai=(await this.api('/api/v1/admin/ai-usage')).items||[]},async role(u){await this.api('/api/v1/admin/users/'+u.id+'/role',{method:'PATCH',body:JSON.stringify({role:u.role})})}}}).use(ElementPlus).mount('#app')</script></body></html>
