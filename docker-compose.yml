services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: k12edu
      POSTGRES_USER: k12edu
      POSTGRES_PASSWORD: k12edu-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U k12edu -d k12edu"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      K12EDU_ADDR: ":8080"
      K12EDU_DATABASE_URL: postgres://k12edu:k12edu-dev@db:5432/k12edu?sslmode=disable
      K12EDU_REDIS_URL: redis://redis:6379/0
      K12EDU_JWT_SECRET: local-development-secret-change-me
      K12EDU_ADMIN_EMAIL: admin@example.com
      K12EDU_ADMIN_PASSWORD: change-this-password
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
