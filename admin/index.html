<html lang="zh-CN">

    <title>课本学习 · 管理后台</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f5f7fb; }
      body { margin: 0; } .shell { display: flex; min-height: 100vh; }
      aside { width: 230px; padding: 28px 18px; color: white; background: #263b80; box-sizing: border-box; }
      h1 { font-size: 20px; margin: 0 0 35px; } nav a { display:block; color:#dbe3ff; padding:11px 12px; border-radius:9px; text-decoration:none; margin:4px 0; }
      nav a.active, nav a:hover { color:white; background:#4058a3; } main { flex:1; padding:38px; max-width: 1100px; }
      h2 { margin-top:0; } .muted { color:#718096; } .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin:28px 0; }
      .card { background:white; border:1px solid #e7ebf3; border-radius:14px; padding:20px; box-shadow:0 4px 14px #23356b0a; }
      .num { display:block; font-size:30px; font-weight:700; margin-top:8px; } .notice { border-left:4px solid #4f6edc; }
      @media(max-width:800px){ aside{width:180px} main{padding:24px}.grid{grid-template-columns:repeat(2,1fr)} }
    </style>
  </head>
  <body><div class="shell"><aside><h1>课本学习<br>管理后台</h1><nav><a class="active" href="/admin/">概览</a><a href="#users">用户管理</a><a href="#content">内容管理</a><a href="#ai">AI 服务</a><a href="#settings">系统设置</a></nav></aside><main><h2>系统概览</h2><p class="muted">后端基础服务已启动，业务模块将在此处接入。</p><section class="grid"><div class="card">用户总数<span class="num">—</span></div><div class="card">今日活跃<span class="num">—</span></div><div class="card">课程完成<span class="num">—</span></div><div class="card">AI 调用<span class="num">—</span></div></section><div class="card notice"><strong>当前状态</strong><p class="muted">这是第一阶段管理后台壳。认证、数据库、同步和 AI 网关接入后，这里将显示真实数据。</p></div></main></div></body>
</html>
