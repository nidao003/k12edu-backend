<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>课本学习 · 管理后台</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; background: #f5f7fb; }
      body { margin: 0; } .shell { display: flex; min-height: 100vh; }
      aside { width: 230px; padding: 28px 18px; color: white; background: #263b80; box-sizing: border-box; }
      h1 { font-size: 20px; margin: 0 0 35px; } nav a { display:block; color:#dbe3ff; padding:11px 12px; border-radius:9px; text-decoration:none; margin:4px 0; }
      nav a.active, nav a:hover { color:white; background:#4058a3; } main { flex:1; padding:38px; max-width: 1100px; }
      h2 { margin-top:0; } .muted { color:#718096; } .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin:28px 0; }
      .card { background:white; border:1px solid #e7ebf3; border-radius:14px; padding:20px; box-shadow:0 4px 14px #23356b0a; }
      .num { display:block; font-size:30px; font-weight:700; margin-top:8px; } .notice { border-left:4px solid #4f6edc; }
      @media(max-width:800px){ aside{width:180px} main{padding:24px}.grid{grid-template-columns:repeat(2,1fr)} }
    </style>
  </head>
  <body><div class="shell"><aside><h1>课本学习<br>管理后台</h1><nav><a class="active" href="/admin/">概览</a><a href="#users">用户管理</a><a href="#content">内容管理</a><a href="#ai">AI 服务</a></nav></aside><main><div id="login" class="card"><h2>管理员登录</h2><p class="muted">使用服务端配置的管理员账号登录。</p><input id="email" placeholder="邮箱" style="padding:12px;width:280px;display:block;margin:8px 0"><input id="password" type="password" placeholder="密码" style="padding:12px;width:280px;display:block;margin:8px 0"><button onclick="login()" style="padding:12px 22px;background:#4058a3;color:#fff;border:0;border-radius:8px">登录</button><p id="error" style="color:#c53b51"></p></div><div id="app" hidden><h2>系统概览</h2><p class="muted">云端服务管理控制台</p><section class="grid"><div class="card">用户总数<span id="userCount" class="num">—</span></div><div class="card">24 小时活跃<span id="activeCount" class="num">—</span></div></section><div class="card notice"><strong>用户列表</strong><p id="userList" class="muted">加载中…</p></div></div></main></div><script>async function login(){const r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok){error.textContent=d.error||'登录失败';return}localStorage.k12token=d.accessToken;load()}async function load(){const t=localStorage.k12token;if(!t)return;const r=await fetch('/api/v1/admin/stats',{headers:{Authorization:'Bearer '+t}});if(!r.ok)return;const d=await r.json();login.hidden=true;app.hidden=false;userCount.textContent=d.users;activeCount.textContent=d.activeUsers24h;const u=await fetch('/api/v1/admin/users',{headers:{Authorization:'Bearer '+t}});const j=await u.json();userList.innerHTML=(j.users||[]).map(x=>x.email+' · '+x.role).join('<br>')||'暂无用户'}load()</script></body>
</html>
